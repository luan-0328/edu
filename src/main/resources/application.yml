spring:
  application:
    name: educore
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/educore?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          max-interval: 10s
          multiplier: 2
        default-requeue-rejected: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
    redis:
      time-to-live: 10m
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
educore:
  cache:
    enabled: ${CACHE_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  enrollment:
    order-ttl-minutes: ${ORDER_TTL_MINUTES:30}
    expiration-scan-ms: ${ORDER_EXPIRATION_SCAN_MS:60000}
    expiration-enabled: ${ORDER_EXPIRATION_ENABLED:true}
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
  exam:
    expiration-enabled: ${EXAM_EXPIRATION_ENABLED:true}
    expiration-scan-ms: ${EXAM_EXPIRATION_SCAN_MS:60000}
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-none}]"
springdoc:
  swagger-ui:
    path: /swagger-ui.html
